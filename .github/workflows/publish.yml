# Publishes the n8n community node package in n8n/ to npm on every version tag push.
# (Moved to the repository root from n8n/.github: GitHub runs workflows only from the root.)
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── SETUP (done 4 Nov 2026) ──────────────────────────────────────────────────
#
# npmjs.com > n8n-nodes-flowmingo > Settings > Trusted Publisher: GitHub Actions,
# flowmingoai/flowmingo-connectors, workflow publish.yml, permission "npm stage
# publish" only. No NPM_TOKEN secret: npm exchanges the job's OIDC token instead.
# 0.1.0, the package's first version, went out with a one-time token (a trusted
# publisher needs an existing package).
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Bump the version in n8n/package.json (and package-lock.json), add the
# CHANGELOG entry, commit, then push a tag such as 0.1.2. This workflow stages
# that version; approve it on npmjs.com > Staged Packages to publish it.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: n8n

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: n8n/package-lock.json

      - name: Install dependencies
        run: 'npm ci'

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Update npm
        run: 'npm install -g npm@11'

      - name: Stage the release
        # The package's trusted publisher (flowmingoai/flowmingo-connectors, publish.yml) is set to stage only: no
        # token, and the version waits on npmjs.com > Staged Packages until a maintainer approves it with 2FA.
        # Lint and build run first, as `npm run release` would; RELEASE_MODE lets the prepublishOnly guard pass.
        run: |
          npm run lint
          npm run build
          npm stage publish
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
